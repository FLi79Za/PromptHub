<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PromptHub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='prompthub-modern.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="brand-mark">P</span>
        <span><strong>PromptHub</strong><small>Creative prompt library</small></span>
      </a>
      <nav class="topnav" aria-label="Primary navigation">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Library</a>
        <a href="{{ url_for('new_prompt') }}">New</a>
        <a href="{{ url_for('descriptors') }}">Builders</a>
        <a href="{{ url_for('json_sync_page') }}">JSON Sync</a>
        <a href="{{ url_for('manage') }}">Manage</a>
      </nav>
      <div class="top-actions">
        {% if nsfw_unlocked %}
          <form method="post" action="{{ url_for('nsfw_lock') }}"><button class="icon-button" title="Lock NSFW prompts">◉</button></form>
        {% else %}
          <form method="post" action="{{ url_for('nsfw_unlock') }}"><button class="icon-button" title="Unlock NSFW prompts">○</button></form>
        {% endif %}
      </div>
    </header>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash-stack">
          {% for message in messages %}<div class="flash-message">{{ message }}</div>{% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main class="page-container">
      {% block content %}{% endblock %}
    </main>
  </div>
  <div id="globalToast" class="global-toast" role="status" aria-live="polite"></div>
  <script>
    window.showToast = function(message) {
      const toast = document.getElementById('globalToast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.__phToastTimer);
      window.__phToastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    };
  </script>
</body>
</html>
